# Fermes minières.
# Interval : secondes entre deux cycles de minage (la ferme doit avoir du carburant).
# Amount   : nombre de tirages par cycle.
# Ores     : minerai -> poids relatif (plus le poids est grand, plus le minerai est fréquent).
# Pages    : nombre de pages de stockage (27 emplacements par page).
